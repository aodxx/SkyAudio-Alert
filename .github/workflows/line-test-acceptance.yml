name: Milestone 4B — LINE Test Acceptance

on:
  workflow_dispatch:
    inputs:
      voice_profile:
        description: 'TTS profile for the LINE test'
        required: true
        default: 'male-friendly'
        type: choice
        options:
          - male-friendly
          - female-friendly
      flood_degraded_mode:
        description: 'Behavior if the flood source is unavailable'
        required: true
        default: 'unknown-weather'
        type: choice
        options:
          - unknown-weather
          - no-send

permissions:
  contents: write

concurrency:
  group: skyaudio-line-test
  cancel-in-progress: false

jobs:
  line-test-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run complete Flood-first pipeline against LINE TEST
        env:
          RUN_MODE: test
          DRY_RUN: 'false'
          LINE_CHANNEL_ACCESS_TOKEN_TEST: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_TEST }}
          LINE_GROUP_ID_TEST: ${{ secrets.LINE_GROUP_ID_TEST }}
          FLOOD_SOURCE_URL: https://chachoengsao-flood.vercel.app/phatthalung
          WEATHER_PAGE_SOURCE_URL: https://chachoengsao-flood.vercel.app/phatthalung/weather
          FLOOD_DEGRADED_MODE: ${{ inputs.flood_degraded_mode }}
          FLOOD_FRESHNESS_LIMIT_MINUTES: '180'
          CONTENT_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTENT_MODEL: ${{ secrets.GEMINI_CONTENT_MODEL || 'gemini-3.8-flash' }}
          GEMINI_CONTENT_FALLBACK_MODEL: ${{ secrets.GEMINI_CONTENT_FALLBACK_MODEL || 'gemini-3.7-flash' }}
          GEMINI_THINKING_LEVEL: low
          TTS_PROVIDER: gemini
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          TTS_PROFILE: ${{ inputs.voice_profile }}
          TTS_VOICE_NAME_MALE: Achird
          TTS_VOICE_NAME_FEMALE: Sulafat
          TTS_LANGUAGE_CODE: th-TH
          TTS_SPEAKING_RATE: '0.92'
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: node src/index.js
