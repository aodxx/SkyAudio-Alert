name: Daily weather announcement

on:
  schedule:
    # 06:00 Asia/Bangkok (UTC+7) = 23:00 UTC previous day.
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: skyaudio-daily
  cancel-in-progress: false

jobs:
  send-daily-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install free Thai TTS
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts
      - name: Run daily forecast (production)
        env:
          RUN_MODE: production
          LINE_CHANNEL_ACCESS_TOKEN_PROD: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_PROD }}
          LINE_GROUP_ID_PROD: ${{ secrets.LINE_GROUP_ID_PROD }}
          TTS_PROVIDER: edge
          TTS_VOICE_NAME: th-TH-PremwadeeNeural
          TTS_SPEAKING_RATE: '0.95'
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: node src/index.js