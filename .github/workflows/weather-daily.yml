name: Daily weather announcement

on:
  schedule:
    # 06:00 Asia/Bangkok (UTC+7) = 23:00 UTC the previous day.
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the generated audio file

concurrency:
  group: skyaudio-daily
  cancel-in-progress: false

jobs:
  send-daily-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily forecast (production)
        env:
          RUN_MODE: production
          LINE_CHANNEL_ACCESS_TOKEN_PROD: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_PROD }}
          LINE_GROUP_ID_PROD: ${{ secrets.LINE_GROUP_ID_PROD }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: node src/index.js
