# User-authorized daily exception: provisional HTML is allowed only while the no-send flood gate passes.
name: Daily Flood-first announcement (PROD target)

on:
  schedule:
    # 06:00 Asia/Bangkok (UTC+7) = 23:00 UTC previous day; GitHub Actions is best-effort.
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: skyaudio-daily-production
  cancel-in-progress: false

jobs:
  send-daily-prod-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg for Gemini TTS MP3 conversion
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run daily Flood-first report (PROD target)
        env:
          RUN_MODE: production
          ALLOW_DAILY_HTML_PRODUCTION_EXCEPTION: 'true'
          LINE_CHANNEL_ACCESS_TOKEN_PROD: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_PROD }}
          LINE_GROUP_ID_PROD: ${{ secrets.LINE_GROUP_ID_PROD }}
          FLOOD_SOURCE_URL: https://chachoengsao-flood.vercel.app/phatthalung
          WEATHER_PAGE_SOURCE_URL: https://chachoengsao-flood.vercel.app/phatthalung/weather
          FLOOD_DEGRADED_MODE: no-send
          CONTENT_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTENT_MODEL: ${{ secrets.GEMINI_CONTENT_MODEL }}
          GEMINI_CONTENT_FALLBACK_MODEL: ${{ secrets.GEMINI_CONTENT_FALLBACK_MODEL || 'gemini-3.7-flash' }}
          TTS_PROVIDER: gemini
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          TTS_PROFILE: male-friendly
          TTS_VOICE_NAME_MALE: Achird
          TTS_VOICE_NAME_FEMALE: Sulafat
          TTS_SPEAKING_RATE: '0.92'
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: node src/index.js
