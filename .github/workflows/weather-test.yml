name: Manual flood/weather test

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build flood/weather/Flex/audio, do not push LINE or commit audio)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  send-test-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg for Gemini TTS MP3 conversion
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate Gemini models before sending
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTENT_MODEL: ${{ secrets.GEMINI_CONTENT_MODEL }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
        run: |
          node <<'NODE'
          const modelChecks = [
            ['GEMINI_CONTENT_MODEL', process.env.GEMINI_CONTENT_MODEL],
            ['GEMINI_TTS_MODEL', process.env.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts'],
          ];
          (async () => {
            for (const [name, rawModel] of modelChecks) {
              const model = String(rawModel || '').trim().replace(/^models\//i, '');
              if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(model)) {
                console.error(`${name} must be a bare model ID; configured value is redacted.`);
                process.exit(1);
              }
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}`, {
                headers: { 'x-goog-api-key': process.env.GEMINI_API_KEY },
              });
              if (!response.ok) {
                console.error(`${name} lookup failed with HTTP ${response.status}; model value is redacted.`);
                process.exit(1);
              }
              const info = await response.json();
              const supported = Array.isArray(info.supportedGenerationMethods)
                && info.supportedGenerationMethods.includes('generateContent');
              console.log(`${name} is available for generateContent: ${supported}`);
              if (!supported) process.exit(1);
            }
          })().catch(() => {
            console.error('Could not validate Gemini model configuration; model value is redacted.');
            process.exit(1);
          });
          NODE
      - name: Run flood/weather test
        env:
          RUN_MODE: test
          DRY_RUN: ${{ inputs.dry_run }}
          LINE_CHANNEL_ACCESS_TOKEN_TEST: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_TEST }}
          LINE_GROUP_ID_TEST: ${{ secrets.LINE_GROUP_ID_TEST }}
          FLOOD_SOURCE_URL: https://chachoengsao-flood.vercel.app/phatthalung
          WEATHER_PAGE_SOURCE_URL: https://chachoengsao-flood.vercel.app/phatthalung/weather
          FLOOD_DEGRADED_MODE: unknown-weather
          CONTENT_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTENT_MODEL: ${{ secrets.GEMINI_CONTENT_MODEL }}
          TTS_PROVIDER: gemini
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          TTS_PROFILE: male-friendly
          TTS_VOICE_NAME_MALE: Achird
          TTS_VOICE_NAME_FEMALE: Sulafat
          TTS_SPEAKING_RATE: '0.92'
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: node src/index.js
