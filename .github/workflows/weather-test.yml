# 🔒 FLOOD-FIRST WORKFLOW — test/dry-run only until acceptance
name: Manual Flood-first test

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build preview artifact; do not push LINE or commit audio)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  send-test-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg for Gemini TTS MP3 conversion
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run Flood-first test
        env:
          RUN_MODE: test
          DRY_RUN: ${{ inputs.dry_run }}
          LINE_CHANNEL_ACCESS_TOKEN_TEST: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_TEST }}
          LINE_GROUP_ID_TEST: ${{ secrets.LINE_GROUP_ID_TEST }}
          FLOOD_SOURCE_URL: https://chachoengsao-flood.vercel.app/phatthalung
          WEATHER_PAGE_SOURCE_URL: https://chachoengsao-flood.vercel.app/phatthalung/weather
          FLOOD_DEGRADED_MODE: unknown-weather
          CONTENT_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTENT_MODEL: ${{ secrets.GEMINI_CONTENT_MODEL }}
          GEMINI_CONTENT_FALLBACK_MODEL: ${{ secrets.GEMINI_CONTENT_FALLBACK_MODEL || 'gemini-3.7-flash' }}
          TTS_PROVIDER: gemini
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          TTS_PROFILE: male-friendly
          TTS_VOICE_NAME_MALE: Achird
          TTS_VOICE_NAME_FEMALE: Sulafat
          TTS_SPEAKING_RATE: '0.92'
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: node src/index.js
      - name: Select Bangkok-date preview audio
        if: ${{ always() && inputs.dry_run }}
        id: preview
        shell: bash
        run: |
          PREVIEW_DATE=$(node -e "console.log(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()))")
          echo "date=$PREVIEW_DATE" >> "$GITHUB_OUTPUT"
      - name: Upload dry-run preview
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: line-test-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public/status/last-run.json
            public/audio/${{ steps.preview.outputs.date }}.mp3
          if-no-files-found: warn
          retention-days: 7
